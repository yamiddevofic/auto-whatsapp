name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Servidor — dependencias
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Servidor — auditoría
        working-directory: server
        run: npm audit --audit-level=high
      - name: Servidor — lint
        working-directory: server
        run: npm run lint
      - name: Servidor — pruebas
        working-directory: server
        run: npm test

      - name: Cliente — dependencias
        working-directory: client
        run: npm ci --ignore-scripts
      - name: Cliente — auditoría
        working-directory: client
        run: npm audit --audit-level=high
      - name: Cliente — build
        working-directory: client
        run: npm run build

      - name: Imagen Docker
        run: docker build -t auto-whatsapp:ci .
