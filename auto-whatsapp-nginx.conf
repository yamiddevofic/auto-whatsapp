# Proxy inverso para Auto WhatsApp.
#
# PENDIENTE DE TLS: este archivo sirve en HTTP plano. Antes de exponerlo a Internet hay
# que terminar TLS (certbot --nginx -d tu-dominio) y redirigir 80 -> 443. Mientras siga
# en HTTP, las credenciales, el token y el código QR viajan sin cifrar.
# Ver Docs/02-hallazgos-seguridad.md SEC-004 y SEC-024.

server {
    listen 4323;
    server_name _;

    # El backend sólo escucha en 127.0.0.1 (BIND_ADDR), así que nginx es la única entrada.
    # El frontend compilado debe vivir fuera del home y del directorio de datos.
    root /var/www/auto-whatsapp/dist;
    index index.html;

    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # Frontend - SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Adjuntos (requieren token: cabecera Authorization o cookie httpOnly)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: faltaba por completo, por lo que el tiempo real no funcionaba tras nginx
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }
}
